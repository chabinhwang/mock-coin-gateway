plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    implementation project(':shared-kernel')
    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.restclient
    implementation libs.spring.boot.starter.actuator
    implementation libs.micrometer.registry.prometheus
    implementation libs.micrometer.tracing.otel
    implementation libs.micrometer.tracing.bridge.otel
    implementation libs.spring.boot.starter.data.redis
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation libs.webauthn.server.core
    // yubico webauthn-server-core는 Jackson 2를 provided로 의존하고 런타임에 사용한다.
    // Boot 4는 기본 Jackson 3(tools.jackson)만 제공하므로 Jackson 2 databind를 명시 추가한다(버전은 Boot BOM 관리).
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation libs.caffeine
    testImplementation libs.spring.boot.starter.test
    testImplementation libs.spring.boot.starter.webmvc.test
    testImplementation 'org.springframework.boot:spring-boot-resttestclient'
    testRuntimeOnly libs.junit.platform.launcher
}
